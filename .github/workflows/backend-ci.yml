# Backend CI: gofmt, vet, build and the full test suite (unit + integration).
# The integration harness opens a fresh SQLite file per test and applies every
# migration, so no database service is needed.
name: backend-ci

on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go build (static)
        run: CGO_ENABLED=0 go build ./...
      # Unit packages run under the race detector. The HTTP integration
      # suite is bcrypt-heavy and takes ~5 minutes with -race, so it runs
      # without it. No AWS credentials exist in CI; disabling the EC2
      # metadata probe keeps the SDK from waiting on it.
      - name: go test (unit, -race)
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: go test -race -count=1 $(go list ./... | grep -v /test/integration)
      - name: go test (integration)
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: go test -count=1 -timeout 10m ./test/integration/
